<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ title }} - Flask App</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
nav { background: #1e3a5f; padding: 14px 30px; }
nav a { color: white; text-decoration: none; margin-right: 20px; }
nav a:hover { color: #ffc107; }
.content { max-width: 700px; margin: 25px auto; background: white; padding: 20px 30px;
border-radius: 6px; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #999; padding: 8px; text-align: left; }
th { background: #2e6da4; color: white; }
footer { text-align: center; color: #666; padding: 15px; }
</style>
</head>
<body>
<nav>
<a href="{{ url_for('home') }}">Home</a>
<a href="{{ url_for('about') }}">About</a>
<a href="{{ url_for('show_students') }}">Students</a>
</nav>
<div class="content">
{% block content %}{% endblock %}
</div>
<footer>Web Technology Lab - Flask Practical | Deployed on Render</footer>
</body>
</html>
